name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/DiskMonitor.csproj

      - name: Build
        run: dotnet build src/DiskMonitor.csproj -c Release --no-restore

      # win-x64 的运行时包只在带 RID 的 restore 中解析，因此这一步不能加 --no-restore
      - name: Publish (self-contained win-x64)
        run: dotnet publish src/DiskMonitor.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskMonitor-win-x64
          path: publish/
          if-no-files-found: error
